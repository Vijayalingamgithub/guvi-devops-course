services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 127.0.0.1:3000:3000
    environment:
      API_UPSTREAM: brain-tasks-api:8000
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./.local/htpasswd:/etc/nginx/auth/htpasswd:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: local-test-only
      AWS_SECRET_ACCESS_KEY: local-test-only
      TASKS_TABLE_NAME: brain-tasks-local
      DYNAMODB_ENDPOINT: http://dynamodb:8000
    networks:
      default:
        aliases: [brain-tasks-api]
    entrypoint:
      - /bin/sh
      - -c
      - python create-local-table.py && exec uvicorn app:app --host 0.0.0.0 --port 8000 --workers 2 --no-server-header
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)"]
      interval: 5s
      timeout: 8s
      retries: 12
    depends_on: [dynamodb]

  dynamodb:
    image: amazon/dynamodb-local:latest@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
    command: [-jar, DynamoDBLocal.jar, -sharedDb, -inMemory]
    # Local demo data is intentionally temporary. EKS uses durable AWS DynamoDB.
