apiVersion: apps/v1
kind: Deployment
metadata:
  name: brain-tasks-api
  namespace: brain-tasks
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 300
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: brain-tasks-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: brain-tasks-api
    spec:
      serviceAccountName: brain-tasks-api
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: brain-tasks-api
      containers:
        - name: api
          image: __API_IMAGE_URI__
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: TASKS_TABLE_NAME
              valueFrom:
                configMapKeyRef:
                  name: brain-tasks-api
                  key: table_name
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: brain-tasks-api
                  key: region
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 8
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
